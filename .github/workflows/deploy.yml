name: Deploy to Desktop
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Copy to web folder
        run: |
          rm -rf /path/to/webroot/*
          cp -r dist/* /path/to/webroot/
